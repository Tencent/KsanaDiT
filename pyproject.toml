[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "kdit"
dynamic = ["version"]
description = "kDiT"
authors = [{ name = "kDiT", email = "kDiT@venus.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = {file = "LICENSE"}
dependencies = [
  "numpy",
  "accelerate >= 1.2.1",
  "diffusers >= 0.35.2",
  "peft >= 0.17.0",
  "gguf >= 0.17.0",
  "pyinstrument >= 5.1.1",
  "dataclasses >= 0.6; python_version < '3.7'",
  "imageio >= 2.34.2",
  "imageio-ffmpeg >= 0.4.8",
  "omegaconf >= 2.3.0",
  "einops >= 0.8.1",
  "strenum >= 0.4.15"
]

[project.urls]
Repository = "https://git.woa.com/venus-aigc/kDiT.git"

#  Used by Comfy Registry https://comfyregistry.org
[tool.comfy]
PublisherId = "kDiT"
DisplayName = "kDiT"
Icon = ""

[project.optional-dependencies]  # 可选依赖
dev = ["pytest>=6.0", "black>=21.0", "pyinstrument>=5.1.1", "pre-commit>=4.0.0"]
gpu = ["xformers >= 0.0.29", "flash_attn >=2.6.0", "triton >= 3.2.0"]
npu = []
xpu = []

[project.scripts]  # 命令行工具
# TODO: 优化脚本的import层次，较少多余的import耽误时间
kdit_install_adapters = "kdit.adapter.install:main"

[tool.setuptools_scm]
version_scheme = "post-release"
write_to = "kdit/_version.py"
local_scheme = "node-and-date"

[tool.setuptools.packages.find]  # 包发现规则
where = ["."]
include = ["kdit*"]
exclude = [
    "tests*", "assets*", "docker*", "docs", "scripts*", "examples*",
    "comfy_models*", "Wan2.2*", "ai*", "outputs*", "plans*", "prompts*",
]

# 包含数据文件（如配置文件）
[tool.setuptools.package-data]
kdit = ["data/*.json"]

# 自定义构建选项
[tool.setuptools]
zip-safe = false  # 禁止以 zip 形式安装

[tool.pytest.ini_options]
pythonpath = [".", "tests/kdit"]  # "." 确保 import kdit 正确；"tests/kdit" 让 helper 模块可直接导入
testpaths = ["tests"]
